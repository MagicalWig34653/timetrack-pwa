<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Keine Verbindung – Timetrack</title>
		<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
		<style>
			/* Self-contained fallback served by the service worker when a navigation fails offline and the app shell is not cached. */
			:root { --bg: #f6f6f7; --card: #ffffff; --fg: #171717; --muted: #666a73; --line: #e2e3e6; --accent: #3b7bf6; }
			@media (prefers-color-scheme: dark) { :root { --bg: #101114; --card: #17181c; --fg: #f2f2f3; --muted: #9a9ea8; --line: #2a2c33; } }
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
			main { width: 100%; max-width: 30rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
			h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.25; }
			h1:focus { outline: none; }
			p { margin: 0 0 20px; color: var(--muted); }
			button { font: inherit; font-weight: 600; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
			button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
		</style>
	</head>
	<body>
		<main role="alert">
			<span style="margin-bottom:16px;display:block;font-weight:600">Timetrack</span>
			<h1 id="title" tabindex="-1">Keine Verbindung</h1>
			<p>Du bist offline. Sobald die Verbindung wieder da ist, kannst du es erneut versuchen. Änderungen werden offline nicht gespeichert.</p>
			<button type="button" onclick="location.assign('/')">Erneut versuchen</button>
		</main>
		<script>document.getElementById("title").focus();</script>
	</body>
</html>
